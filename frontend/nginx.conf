events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    aio off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;
        server_name localhost;

        # Resolver interno de Docker para que los upstreams se resuelvan
        # en cada petición (no al arrancar), y nginx no muera si alguno
        # todavía no está listo.
        resolver 127.0.0.11 valid=30s;

        # Timeouts y política de reintento aplicables a todos los upstreams.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # ==========================================
        # 1. CAPA DE CLIENTE: Frontend de React
        # ==========================================
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ==========================================
        # 2. PROXY INVERSO: Auth Service (Node.js)
        # ==========================================
        location /api/v1/auth/ {
            set $auth_backend "http://auth-node:3001";
            proxy_pass $auth_backend$request_uri;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ACCESO A SWAGGER DE NODE.JS (api-docs)
        location /api-docs {
            set $auth_docs "http://auth-node:3001";
            proxy_pass $auth_docs$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # 3. PROXY INVERSO: Orchestrator (Java)
        # ==========================================
        location /api/v1/orchestrator/ {
            set $orchestrator_backend "http://orchestrator-java:8080";
            proxy_pass $orchestrator_backend$request_uri;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ACCESO A SWAGGER DE JAVA (Springdoc)
        location /swagger-ui/ {
            set $orchestrator_swagger "http://orchestrator-java:8080";
            proxy_pass $orchestrator_swagger$request_uri;
            proxy_set_header Host $host;
        }
        location /v3/api-docs {
            set $orchestrator_apidocs "http://orchestrator-java:8080";
            proxy_pass $orchestrator_apidocs$request_uri;
            proxy_set_header Host $host;
        }

        # ==========================================
        # 4. PROXY INVERSO: Core Service (Python)
        # OJO: el container_name en docker-compose.yml es "core-python"
        # ==========================================
        location /docs {
            set $python_backend "http://core-python:8001";
            proxy_pass $python_backend$request_uri;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $python_openapi "http://core-python:8001";
            proxy_pass $python_openapi$request_uri;
            proxy_set_header Host $host;
        }
    }
}
