{
   "openapi":"3.1.0",
   "info":{
      "title":"Core Service & Persistence (Python)",
      "description":"Microservicio encargado de validaciones profundas de negocio y persistencia en PostgreSQL",
      "version":"1.0.0"
   },
   "paths":{
      "/core2/balance":{
         "post":{
            "tags":[
               "Accounts & Transfers"
            ],
            "summary":"Get Balance",
            "operationId":"get_balance_core2_balance_post",
            "requestBody":{
               "content":{
                  "application/json":{
                     "schema":{
                        "type":"object",
                        "title":"Payload"
                     },
                     "example":{
                        "userId":1
                     }
                  }
               },
               "required":true
            },
            "responses":{
               "200":{
                  "description":"Successful Response",
                  "content":{
                     "application/json":{
                        "schema":{
                           "$ref":"#/components/schemas/BalanceQueryResponse"
                        }
                     }
                  }
               },
               "422":{
                  "description":"Validation Error",
                  "content":{
                     "application/json":{
                        "schema":{
                           "$ref":"#/components/schemas/HTTPValidationError"
                        }
                     }
                  }
               }
            }
         }
      },
      "/core3/transfers":{
         "post":{
            "tags":[
               "Accounts & Transfers"
            ],
            "summary":"Execute Transfer",
            "operationId":"execute_transfer_core3_transfers_post",
