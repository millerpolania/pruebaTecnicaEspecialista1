      "/health":{
         "get":{
            "tags":[
               "Health"
            ],
            "summary":"Health Check",
            "operationId":"health_check_health_get",
            "responses":{
               "200":{
                  "description":"Successful Response",
                  "content":{
                     "application/json":{
                        "schema":{
                           
                        }
                     }
                  }
               }
            }
         }
      }
   },
   "components":{
      "schemas":{
         "BalanceQueryResponse":{
            "properties":{
               "account_id":{
                  "type":"integer",
                  "title":"Account Id"
               },
               "balance":{
                  "type":"string",
                  "title":"Balance"
               }
            },
            "type":"object",
            "required":[
               "account_id",
               "balance"
            ],
            "title":"BalanceQueryResponse"
         },
         "FundsTransferRequest":{
            "properties":{
               "origin_user_id":{
                  "type":"integer",
                  "title":"Origin User Id"
               },
               "destination_phone":{
                  "type":"string",
                  "title":"Destination Phone",
                  "description":"Número de teléfono destino"
               },
               "amount":{
                  "anyOf":[
                     {
                        "type":"number",
                        "exclusiveMinimum":0.0
                     },
                     {
                        "type":"string"
                     }
                  ],
                  "title":"Amount"
               }
            },
            "type":"object",
            "required":[
               "origin_user_id",
               "destination_phone",
               "amount"
            ],
            "title":"FundsTransferRequest"
         },
         "HTTPValidationError":{
            "properties":{
               "detail":{
                  "items":{
                     "$ref":"#/components/schemas/ValidationError"
                  },
                  "type":"array",
                  "title":"Detail"
               }
            },
            "type":"object",
            "title":"HTTPValidationError"
         },
         "LoginLookupRequest":{
            "properties":{
               "username":{
                  "type":"string",
                  "title":"Username"
               }
            },
            "type":"object",
            "required":[
               "username"
            ],
            "title":"LoginLookupRequest"
         },
         "MovementsQueryRequest":{
            "properties":{
               "userId":{
                  "type":"integer",
                  "title":"Userid"
               }
            },
            "type":"object",
            "required":[
               "userId"
            ],
            "title":"MovementsQueryRequest"
         },
         "UserProfileResponse":{
            "properties":{
               "id":{
                  "type":"integer",
                  "title":"Id"
               },
               "username":{
                  "type":"string",
                  "title":"Username"
               },
               "email":{
                  "type":"string",
                  "title":"Email"
               },
               "document_type":{
                  "type":"string",
                  "title":"Document Type"
               },
               "document_id":{
                  "type":"string",
                  "title":"Document Id"
               },
               "phone_number":{
                  "type":"string",
                  "title":"Phone Number"
               },
               "password_hash":{
                  "type":"string",
                  "title":"Password Hash"
               }
            },
            "type":"object",
            "required":[
               "id",
               "username",
               "email",
               "document_type",
               "document_id",
               "phone_number",
               "password_hash"
            ],
            "title":"UserProfileResponse"
         },
         "ValidationError":{
            "properties":{
               "loc":{
                  "items":{
                     "anyOf":[
                        {
                           "type":"string"
                        },
                        {
                           "type":"integer"
                        }
                     ]
                  },
                  "type":"array",
                  "title":"Location"
               },
               "msg":{
                  "type":"string",
                  "title":"Message"
               },
               "type":{
                  "type":"string",
                  "title":"Error Type"
               }
            },
            "type":"object",
            "required":[
               "loc",
               "msg",
               "type"
            ],
            "title":"ValidationError"
         }
      }
   }
}