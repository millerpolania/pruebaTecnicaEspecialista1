{
   "openapi":"3.0.1",
   "info":{
      "title":"Bank Gateway API (Java)",
      "description":"Componente central encargado del balance, transferencias y resiliencia de la plataforma bancaria",
      "version":"1.0.0"
   },
   "servers":[
      {
         "url":"http://localhost",
         "description":"Generated server url"
      }
   ],
   "tags":[
      {
         "name":"Bank Gateway Financial API",
         "description":"Endpoints controlados y orquestados para la Fintech políglota"
      }
   ],
   "paths":{
      "/api/v1/orchestrator/transfers":{
         "post":{
            "tags":[
               "Bank Gateway Financial API"
            ],
            "summary":"Ejecución transaccional de transferencias por teléfono con protección Circuit Breaker y token Redis",
            "operationId":"executeOrchestratedTransfer",
            "parameters":[
               {
                  "name":"Authorization",
                  "in":"header",
                  "required":true,
                  "schema":{
                     "type":"string"
                  }
               }
            ],
            "requestBody":{
               "content":{
                  "application/json":{
                     "schema":{
                        "$ref":"#/components/schemas/FundsTransferRequest"
                     }
                  }
               },
               "required":true
            },
            "responses":{
               "200":{
                  "description":"OK",
                  "content":{
                     "*/*":{
                        "schema":{
                           "type":"string"
                        }
                     }
                  }
               }
            }
         }
      },
      "/api/v1/orchestrator/notifications/{userId}":{
         "get":{
            "tags":[
               "Bank Gateway Financial API"
            ],
            "summary":"Historial de alertas de movimientos procesado localmente en Java",
            "operationId":"getLocalNotifications",
            "parameters":[
               {
                  "name":"Authorization",
                  "in":"header",
                  "required":true,
                  "schema":{
                     "type":"string"
                  }
               },
               {
                  "name":"userId",
                  "in":"path",
                  "required":true,
                  "schema":{
                     "type":"integer",
                     "format":"int64"
                  }
               }
            ],
            "responses":{
               "200":{
                  "description":"OK",
                  "content":{
                     "*/*":{
                        "schema":{
                           "type":"array",
                           "items":{
                              "type":"string"
                           }
                        }
                     }
                  }
               }
            }
         }
      },
      "/api/v1/orchestrator/movements/{userId}":{
         "get":{
            "tags":[
               "Bank Gateway Financial API"
            ],
            "summary":"Consulta de movimientos histórica orquestada mediante GET",
            "operationId":"getOrchestratedMovements",
            "parameters":[
               {
                  "name":"Authorization",
                  "in":"header",
                  "required":true,
                  "schema":{
                     "type":"string"
                  }
               },
               {
                  "name":"userId",
                  "in":"path",
                  "required":true,
                  "schema":{
                     "type":"integer",
                     "format":"int64"
                  }
               }
            ],
            "responses":{
               "200":{
                  "description":"OK",
                  "content":{
                     "*/*":{
                        "schema":{
                           "type":"array",
                           "items":{
                              "$ref":"#/components/schemas/TransactionRecordResponse"
                           }
                        }
                     }
                  }
               }
            }
         }
      },
      "/api/v1/orchestrator/accounts/balance/{userId}":{
         "get":{
            "tags":[
               "Bank Gateway Financial API"
            ],
            "summary":"Consulta de saldo segura orquestada hacia Core",
            "operationId":"getOrchestratedBalance",
            "parameters":[
               {
                  "name":"Authorization",
                  "in":"header",
                  "required":true,
                  "schema":{
                     "type":"string"
                  }
               },
               {
                  "name":"userId",
                  "in":"path",
                  "required":true,
                  "schema":{
                     "type":"integer",
                     "format":"int64"
                  }
               }
            ],
            "responses":{
               "200":{
                  "description":"OK",
                  "content":{
                     "*/*":{
                        "schema":{
                           "$ref":"#/components/schemas/AccountBalanceResponse"
                        }
                     }
                  }
               }
            }
         }
      }
   },
   "components":{
      "schemas":{
         "FundsTransferRequest":{
            "type":"object",
            "properties":{
               "amount":{
                  "type":"number",
                  "format":"double"
               },
               "origin_user_id":{
                  "type":"integer",
                  "format":"int64"
               },
               "destination_phone":{
                  "type":"string"
               }
            }
         },
         "TransactionRecordResponse":{
            "type":"object",
            "properties":{
               "id":{
                  "type":"integer",
                  "format":"int64"
               },
               "amount":{
                  "type":"number",
                  "format":"double"
               },
               "timestamp":{
                  "type":"string"
               },
               "type":{
                  "type":"string"
               },
               "origin_account_id":{
                  "type":"integer",
                  "format":"int64"
               },
               "destination_phone":{
                  "type":"string"
               }
            }
         },
         "AccountBalanceResponse":{
            "type":"object",
            "properties":{
               "balance":{
                  "type":"number",
                  "format":"double"
               },
               "account_id":{
                  "type":"integer",
                  "format":"int64"
               }
            }
         }
      }
   }
}