version: '3.8'

services:
  # --- INFRAESTRUCTURA ---
  db:
    image: postgres:15-alpine
    container_name: bank-db
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bank_db
    expose:
      - "5432"
    networks:
      - bank-network

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    expose:
      - "6379"
    networks:
      - bank-network

  # --- MICROSERVICIOS ---
  auth-service:
    platform: linux/amd64
    build:
      context: ./auth-service
    container_name: auth-node
    environment:
      DATABASE_URL: postgres://user_admin:password123@db:5432/bank_db
      REDIS_URL: redis://redis:6379
      CORE_SERVICE_URL: http://core-python:8001
    expose:
      - "3001"
    depends_on:
      - db
      - redis
    networks:
      - bank-network

  core-service:
    platform: linux/amd64
    build:
      context: ./core-service
    container_name: core-python
    environment:
      DATABASE_URL: postgresql://user_admin:password123@db:5432/bank_db
    expose:
      - "8001"
    depends_on:
      - db
    networks:
      - bank-network

  core-tests:
    platform: linux/amd64
    build:
      context: ./core-service
    container_name: core-python-tests
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: ".:/app"
    command: pytest /app/test -v
    depends_on:
      - db
    networks:
      - bank-network

  auth-tests:
    platform: linux/amd64
    build:
      context: ./auth-service
      dockerfile: Dockerfile.test
    container_name: auth-node-tests
    environment:
      NODE_ENV: test
    networks:
      - bank-network

  orchestrator-tests:
    platform: linux/amd64
    build:
      context: ./orchestrator-java
      dockerfile: Dockerfile.test
    container_name: orchestrator-java-tests
    networks:
      - bank-network

  frontend-tests:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: frontend-react-tests
    networks:
      - bank-network

  orchestrator:
    platform: linux/amd64
    build:
      context: ./orchestrator-java
    container_name: orchestrator-java
    environment:
      SERVICES_AUTH_URL: http://auth-node:3001
      SERVICES_CORE_URL: http://core-python:8001
    expose:
      - "8080"
    depends_on:
      - auth-service
      - core-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 70s
    networks:
      - bank-network

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
    container_name: frontend-react
    ports:
      - "8000:80"
    depends_on:
      orchestrator:
        condition: service_healthy
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
    networks:
      - bank-network

# --- CONFIGURACIÓN DE REDES ---
networks:
  bank-network:
    driver: bridge